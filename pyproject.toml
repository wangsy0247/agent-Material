[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-material-project"
version = "0.1.0"
description = "材料科学领域 LLM Agent 项目（参照 DeerFlow 层级架构）"
requires-python = ">=3.10"
dependencies = [
    # 核心框架（editable install: backend/packages/agent_material）
    # 网关层
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.0.0",
    "python-multipart>=0.0.9",
    # 认证模块
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "email-validator>=2.0.0",
    # 测试
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.setuptools]
# 根项目仅用于聚合依赖与 pytest 配置，不包含可分发的 Python 包
packages = []

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/packages"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]
