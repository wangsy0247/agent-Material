# Promtail 配置 — 读取 JSON 日志文件并推送到 Loki

server:
  http_listen_port: 9080
  grpc_listen_port: 0

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Agent Gateway 日志
  - job_name: agent_gateway_logs
    static_configs:
      - targets: [localhost]
        labels:
          service: agent_material
          __path__: /logs/gateway*.jsonl
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            trace_id: trace_id
            span_id: span_id
            request_id: request_id
            session_id: session_id
            user_id: user_id
            component: component
            file: file
      - timestamp:
          source: timestamp
          format: RFC3339
      - labels:
          level:
          component:
          trace_id:
          request_id:

  # RAG MCP Server 日志
  - job_name: rag_mcp_server_logs
    static_configs:
      - targets: [localhost]
        labels:
          service: rag_mcp_server
          __path__: /logs/server*.jsonl
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            trace_id: trace_id
            span_id: span_id
            request_id: request_id
            component: component
      - timestamp:
          source: timestamp
          format: RFC3339
      - labels:
          level:
          component:
          trace_id:
          request_id:
