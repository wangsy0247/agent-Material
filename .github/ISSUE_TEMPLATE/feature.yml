name: Feature request
description: Propose a scoped improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful change and its trade-offs.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: How could the change be tested or evaluated?
