embedding_model_name: text-embedding-v4
# ── 切分器配置 ──────────────────────────────────────────────────
# 通用参数
chunk_size: 500
chunk_overlap: 70
separator: [ '.', '!', '?', '\n\n', '。', '！', '？', '\n', ';', ' ', '']

# 各切分器专属参数
splitters:
  recursive:
    chunk_size: 500
    chunk_overlap: 70
  semantic:
    chunk_size: 500
    chunk_overlap: 70
    similarity_threshold: 0.9   # 相邻 chunk 合并阈值
    min_chunk_size: 100          # SemanticChunker 最小 chunk
  semantic_merge:
    similarity_threshold: 0.9   # 语义合并阈值
  parent:
    parent_chunk_size: 2000      # 父文档大小
    child_chunk_size: 400        # 子文档大小

character_name: agent
# PostgreSQL + pgvector 连接字符串
connection_string: "postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres"

md5_hex_store: md5.text
document_directory: datas
allow_type: [".pdf", ".txt", ".md", ".html", ".docx", ".pptx"]

# ── 扩展名 → 切分流水线 ────────────────────────────────────────
# 每个扩展名对应一个步骤列表，按顺序链式执行。单项即单步。
extension_pipeline:
  ".md":    [markdown_header, recursive, semantic_merge]
  ".pdf":   [markdown_header, recursive, semantic_merge]
  ".html":  [html_header, recursive, semantic_merge]
  ".txt":   [recursive]
  ".docx":  [recursive]
  ".pptx":  [recursive]


# 检索配置
k: 10                     # 向量/BM25 检索返回数量（减小以减少重排序负担）
score_threshold: 0.3     # 向量相似度阈值（提高以过滤低质量文档）
top_n: 5                 # 重排序后返回数量
max_rerank_docs: 10      # 进入重排序器的最大文档数（截断保护）

# 重排序开关（CPU 上 0.6B 模型推理很慢，如无 GPU 建议关闭）
enable_reranker: true
reranker_batch_size: 8   # CrossEncoder batch size（越大 CPU/GPU 利用率越高）
reranker_model: "/mnt/d/models/Qwen3-Reranker-0.6B"  # 重排序模型（本地路径）
bm25_weight: 0.5         # BM25 检索权重
vector_weight: 0.5       # 向量检索权重
