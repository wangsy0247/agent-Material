# MCP (Model Context Protocol) 配置
# 定义项目中 MCP Server 的接入信息
#
# 解耦架构：
#   - RAG 工具保留在本地（进程内直接调用，不走 MCP）
#   - Materials Project 工具完全通过 MCP Server 暴露（独立部署）
#
# 启动方式：
#   1. 先启动 MP MCP Server：
#      python -m mcp_servers.tools.mp_mcp_server --transport sse --host 127.0.0.1 --port 8002
#   2. 再启动主应用：
#      python api_server.py

servers:
  # Materials Project MCP Server（SSE 远程模式）
  # Agent 通过 MCP 协议调用：mp_download / mp_query / mp_list
  - name: material_project
    url: "http://127.0.0.1:8002/sse"
    transport: sse
    enabled: true
    description: "Materials Project 材料数据库服务（远程 MCP）"

  # Materials Project MCP Server（stdio 本地子进程模式 — 开发备用）
  - name: material_project_stdio
    command: ["python", "-m", "mcp_servers.tools.mp_mcp_server"]
    transport: stdio
    enabled: false
    description: "Materials Project 材料数据库服务（本地子进程模式）"

  # 文件系统 MCP Server（第三方，默认禁用）
  - name: filesystem
    command: ["npx", "-y", "@modelcontextprotocol/server-filesystem", "/mnt/d/Langchain_study/Agent智能体/Agent Material/workspace"]
    transport: stdio
    enabled: false
    description: "本地文件系统访问"

# MCP Client 全局配置
client:
  # SSE 连接超时（秒）
  timeout: 5.0
  # 单次工具调用超时（秒）
  tool_timeout: 30.0
  # 最大并发连接数
  max_connections: 10

# 安全设置
security:
  # 是否要求用户确认敏感操作
  confirm_sensitive_ops: true
  # 敏感操作关键词列表
  sensitive_keywords:
    - "download"
    - "write"
    - "delete"
    - "exec"
