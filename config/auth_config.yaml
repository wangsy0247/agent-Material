# ============================================
# 认证模块配置 (Authentication Configuration)
# ============================================

# JWT 密钥不写入仓库，必须通过环境变量 AUTH_SECRET_KEY 提供。
# 服务启动时会拒绝空值、已知占位符和少于 32 字符的弱密钥。
secret_key: null

# Token 过期时间（分钟）
access_token_expire_minutes: 60

# 刷新 Token 过期时间（天）
refresh_token_expire_days: 7

# 密码哈希算法
algorithm: "HS256"

# 是否允许匿名访问（向后兼容模式）
# true:  未携带 Token 的请求使用 user_id="anonymous"
# false: 所有请求必须携带有效 Token
allow_anonymous: false

# 不自动创建默认管理员。首次部署请运行 scripts/create_admin.py，
# 交互式设置管理员密码。
