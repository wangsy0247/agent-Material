embedding_model_name: text-embedding-v4
# ── 切分器配置 ──────────────────────────────────────────────────
# 通用参数
chunk_size: 500
chunk_overlap: 70
separator: [ '.', '!', '?', '\n\n', '。', '！', '？', '\n', ';', ' ', '']

# 各切分器专属参数
splitters:
  recursive:
    chunk_size: 500
    chunk_overlap: 70
  semantic:
    chunk_size: 500
    chunk_overlap: 70
    similarity_threshold: 0.9   # 相邻 chunk 合并阈值
    min_chunk_size: 100          # SemanticChunker 最小 chunk
  semantic_merge:
    similarity_threshold: 0.9   # 语义合并阈值
  parent:
    parent_chunk_size: 2000      # 父文档大小
    child_chunk_size: 500        # 子文档大小

character_name: agent
# PostgreSQL + pgvector 连接字符串
connection_string: "${PGVECTOR_URL:-postgresql+psycopg://agent_material:agent_material_dev@127.0.0.1:5433/langgraph}"

document_directory: data

# ── PDF 图表结构化索引（P0：对象级检索，不启用图片向量）────────
structured_index:
  enabled: true
  artifact_root: ".rag_assets"
  include_figures: true
  include_tables: true
  require_figure_asset: true
  require_semantic_figure_signal: true
  require_table_content: true
  fail_on_incomplete_artifact: true
  nearby_context_chars: 500
  nearby_context_blocks: 3
  max_table_chars_per_record: 12000
  # P1：通过视觉模型离线生成结构化描述，再复用现有文本混合检索。
  # 默认关闭，避免未授权时把图片发送给外部服务。
  visual_enrichment:
    enabled: "${RAG_VISUAL_ENRICHMENT_ENABLED:-false}"
    provider: "dashscope_openai"
    model: "${RAG_VISUAL_MODEL:-qwen3-vl-plus}"
    base_url: "${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}"
    api_key_env: "DASHSCOPE_API_KEY"
    timeout_seconds: 45
    max_retries: 2
    max_concurrency: 2
    max_image_bytes: 10485760
    max_images_per_document: 32
    failure_policy: "fallback_text"
    prompt_version: "visual-chart-v1"
    image_preprocessing:
      enabled: true
      # MinerU 图片低于该尺寸时，按原 PDF 页码与 bbox 重新渲染。
      min_width_px: 1200
      min_height_px: 800
      render_dpi: 300
      max_render_dpi: 450
      padding_points: 6
      bbox_coordinate_space: "normalised_1000"
      # 只按明显的长空白沟槽切分复合图，检测不确定时保留完整高清图。
      panel_crops_enabled: true
      auto_panel_detection: false
      whitespace_ratio: 0.008
      min_gap_ratio: 0.018
      min_panel_ratio: 0.20
    numeric_fact_gate:
      # 模型自报 confidence 不构成事实验证；默认只信任人工或可信解析器。
      policy: "trusted_verification_only"
      min_readable_width_px: 1000
      min_readable_height_px: 700
    # 在线多模态回答单独开关；失败时始终退回冻结的文本 RAG 上下文。
    online_answer:
      enabled: "${RAG_MULTIMODAL_ANSWER_ENABLED:-false}"
      model: "${RAG_VISUAL_MODEL:-qwen3-vl-plus}"
      base_url: "${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}"
      api_key_env: "DASHSCOPE_API_KEY"
      timeout_seconds: 60
      max_retries: 1
      max_images: 2
      max_image_bytes: 10485760
  # P2：真正的图片/Panel 向量索引。默认关闭；只有获得图片外发授权并完成
  # Gold 评测后再开启。图片和查询文本必须使用同一多模态模型及维度。
  multimodal_embedding:
    enabled: "${RAG_IMAGE_EMBEDDING_ENABLED:-false}"
    provider: "dashscope"
    model: "${RAG_IMAGE_EMBEDDING_MODEL:-qwen3-vl-embedding}"
    dimension: 1024
    collection_suffix: "_visual"
    endpoint: "https://dashscope.aliyuncs.com/api/v1/services/embeddings/multimodal-embedding/multimodal-embedding"
    api_key_env: "DASHSCOPE_API_KEY"
    timeout_seconds: 45
    max_retries: 2
    batch_size: 8
    max_image_bytes: 10485760
    k: 8
    score_threshold: 0.25
    weight: 0.4
    query_scope: "original_only"

# allow_type: [".pdf", ".txt", ".md", ".html", ".docx", ".pptx"]
allow_type: [".pdf"]

# ── 扩展名 → 切分流水线 ────────────────────────────────────────
# 每个扩展名对应一个步骤列表，按顺序链式执行
# parent 步骤：在末尾增加父子文档切分（用于多粒度索引）
extension_pipeline:
  ".md":    [markdown_header, recursive, semantic_merge, parent]
  ".pdf":   [markdown_header, recursive, semantic_merge, parent]
  ".html":  [html_header, recursive, semantic_merge, parent]
  ".txt":   [recursive, parent]
  ".docx":  [recursive, parent]
  ".pptx":  [recursive, parent]

splitter_type: "semantic"       # 手动添加文档时的默认切分器

# ── 检索配置 ──────────────────────────────────────────────────
k: 10                     # 向量/BM25 检索返回数量
score_threshold: 0.5      # 向量相似度阈值

# BM25 使用固定的材料领域混合 tokenizer。词项门禁用于避免零命中查询仍返回任意 Top-K；
# min_score 默认关闭，因为 rank-bm25 在极小语料库中的有效匹配也可能为 0/负分。
bm25:
  analyzer: material_mixed_v1
  min_term_overlap: 1
  min_score: null
top_n: 5                  # 重排序后返回数量
max_rerank_docs: 10       # 进入重排序器的最大文档数

# 重排序开关（使用 DashScope API 重排序，无需本地 GPU）
enable_reranker: true
# 最终上下文字符预算（ONL-011）：超出时按父块相关性顺序丢弃尾部块
context_budget_chars: 8000
# ── 重排序配置 ──────────────────────────────────────────────────
reranker:
  provider: "dashscope"          # dashscope=阿里云API重排序, local=本地HuggingFace模型
  model: "qwen3-rerank"          # DashScope 重排序模型（gte-rerank 已下线）
  top_n: 3                       # 重排序后返回数量
bm25_weight: 0.2          # BM25 检索权重
vector_weight: 0.8        # 向量检索权重

# ── 多粒度索引 ──────────────────────────────────────────────────
multi_granularity:
  enabled: true                    # 启用多粒度索引（true=双层collection）
  small_collection_suffix: "_small" # 子chunk collection 后缀
  large_collection_suffix: "_large" # 父chunk collection 后缀

# ── Query Routing & Classification ──────────────────────────────
query_routing:
  enabled: true                    # 主开关
  chat_detection: true             # 闲聊识别 → 直答（不走RAG，降低延迟）
  irrelevant_detection: true       # 无关问题拦截 → 拒答
  question_classification: true    # 问题类型标注（factual/summary/comparison）
  confidence_threshold: 0.7        # 最低置信度阈值

# ── Query Rewriting ─────────────────────────────────────────────
query_rewriting:
  # 总开关默认关闭。只有将此项改为 true、调用方传入 enable_rewrite=true，
  # 并显式指定具体策略时，才会调用改写模型。
  enabled: false
  # 空字符串 = 不做改写，避免 Agent 已生成检索词后被检索层二次改写。
  default_strategy: ""
  # 改写使用独立的非流式模型配置。默认复用 agent_config.chat_model_name，
  # 但显式关闭思考模式，减少规划阶段的长尾延迟。
  model:
    name: ""
    max_tokens: 1024
    enable_thinking: false
  # HyDE 开关：启用后自动在策略前追加 hyde+（如 hyde+step_back+expand）
  # 使用假设文档 embedding 增强向量检索，但增加约 2s 延迟
  enable_hyde: false
  # 每请求最大唯一查询数（含原始 query，原始 query 必须始终在列）
  max_queries: 3
  # 跨查询 RRF 融合后保留的候选数（进入全局 Rerank 的输入规模）
  fusion_top_n: 20
  # 各查询类型在跨查询 weighted RRF 中的权重（ONL-004）
  weights:
    original: 1.0        # 原始 query
    step_back: 0.8       # 退一步抽象查询
    expand: 0.7          # 同义扩展查询
  expansion:
    num_queries: 3                 # 生成的查询变体数量（含原始查询）
    merge_top_k: 10                # 每个变体的最大召回数
    final_top_k: 5                 # 融合后最终返回数
  hyde:
    doc_length: 150                # 假设文档目标字数
  step_back:
    merge_top_k: 10
    final_top_k: 5
  decomposition:
    max_sub_queries: 5             # 最大子问题数量
    merge_top_k: 10
    final_top_k: 5

# ── 异步 Embedding 配置 ──────────────────────────────────────────
async_embedding:
  enabled: true
  batch_size: 10          # 每批次文本数（DashScope限制≤10）
  max_concurrency: 4      # 最大并发 API 请求数
  rate_limit: 500        # 每秒最大请求数
  retry_on_failure: 3     # 失败重试次数

# ── 向量索引配置 ──────────────────────────────────────────────────
vector_index:
  enabled: true            # 是否启用向量索引（false=精确暴力搜索）
  method: hnsw             # 索引类型：hnsw | ivfflat
  hnsw:
    m: 16                  # 每个节点的最大连接数（越大召回越高，内存越大）
    ef_construction: 64    # 构建时的搜索深度（越大图质量越高）
  query:
    ef_search: 40          # 查询时的搜索深度（越大召回越高，查询越慢）

# ── 在线/索引策略开关 ───────────────────────────────────────────
feature_flags:
  versioned_ingest: true       # 版本化索引（staging→active）
  parent_first_split: true     # 父块优先切分
  active_version_filter: true  # 在线只检索 active 版本
  atomic_bm25_refresh: true    # BM25 原子刷新
  cross_query_rrf: true        # 跨查询 weighted RRF
  global_rerank: true          # 原始 query 全局 Rerank（每请求一次）
  enable_vector_search: true   # 执行向量召回（可作为正式消融开关）
  enable_bm25_search: true     # 执行 BM25 召回（可作为正式消融开关）
  enable_visual_search: true   # 图片向量总开关开启后，允许作为第三路召回
  parent_backtrack: true       # 全局重排后回溯父块
  request_scoped_hyde: true    # 请求级 HyDE（不共享状态）
  single_retrieval_sse: true   # SSE 单次检索 + 上下文冻结

# BM25 revision 检测节流间隔（秒，Spec V2 9.2）：检索路径上距上次检查超过
# 该间隔才查一次 PG active_revision，落后则重建 BM25（多查询进程兜底）
bm25_revision_check_interval: 2.0
