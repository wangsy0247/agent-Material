embedding_model_name: text-embedding-v4
# ── 切分器配置 ──────────────────────────────────────────────────
# 通用参数
chunk_size: 500
chunk_overlap: 70
separator: [ '.', '!', '?', '\n\n', '。', '！', '？', '\n', ';', ' ', '']

# 各切分器专属参数
splitters:
  recursive:
    chunk_size: 500
    chunk_overlap: 70
  semantic:
    chunk_size: 500
    chunk_overlap: 70
    similarity_threshold: 0.9   # 相邻 chunk 合并阈值
    min_chunk_size: 100          # SemanticChunker 最小 chunk
  semantic_merge:
    similarity_threshold: 0.9   # 语义合并阈值
  parent:
    parent_chunk_size: 2000      # 父文档大小
    child_chunk_size: 500        # 子文档大小

character_name: agent
# PostgreSQL + pgvector 连接字符串
connection_string: "postgresql+psycopg://postgres:postgres@127.0.0.1:5433/postgres"

document_directory: data
# allow_type: [".pdf", ".txt", ".md", ".html", ".docx", ".pptx"]
allow_type: [".pdf"]

# ── 扩展名 → 切分流水线 ────────────────────────────────────────
# 每个扩展名对应一个步骤列表，按顺序链式执行
# parent 步骤：在末尾增加父子文档切分（用于多粒度索引）
extension_pipeline:
  ".md":    [markdown_header, recursive, semantic_merge, parent]
  ".pdf":   [markdown_header, recursive, semantic_merge, parent]
  ".html":  [html_header, recursive, semantic_merge, parent]
  ".txt":   [recursive, parent]
  ".docx":  [recursive, parent]
  ".pptx":  [recursive, parent]

splitter_type: "semantic"       # 手动添加文档时的默认切分器

# ── 检索配置 ──────────────────────────────────────────────────
k: 10                     # 向量/BM25 检索返回数量
score_threshold: 0.5      # 向量相似度阈值
top_n: 5                  # 重排序后返回数量
max_rerank_docs: 10       # 进入重排序器的最大文档数

# 重排序开关（使用 DashScope API 重排序，无需本地 GPU）
enable_reranker: true
# ── 重排序配置 ──────────────────────────────────────────────────
reranker:
  provider: "dashscope"          # dashscope=阿里云API重排序, local=本地HuggingFace模型
  model: "qwen3-rerank"          # DashScope 重排序模型（gte-rerank 已下线）
  top_n: 3                       # 重排序后返回数量
bm25_weight: 0.5          # BM25 检索权重
vector_weight: 0.5        # 向量检索权重

# ── 多粒度索引 ──────────────────────────────────────────────────
multi_granularity:
  enabled: true                    # 启用多粒度索引（true=双层collection）
  small_collection_suffix: "_small" # 子chunk collection 后缀
  large_collection_suffix: "_large" # 父chunk collection 后缀

# ── Query Routing & Classification ──────────────────────────────
query_routing:
  enabled: true                    # 主开关
  chat_detection: true             # 闲聊识别 → 直答（不走RAG，降低延迟）
  irrelevant_detection: true       # 无关问题拦截 → 拒答
  question_classification: true    # 问题类型标注（factual/summary/comparison）
  confidence_threshold: 0.7        # 最低置信度阈值

# ── Query Rewriting ─────────────────────────────────────────────
query_rewriting:
  # 默认策略（空字符串 = 不做改写，auto = 根据问题类型自适应）
  default_strategy: "step_back+expand"
  # HyDE 开关：启用后自动在策略前追加 hyde+（如 hyde+step_back+expand）
  # 使用假设文档 embedding 增强向量检索，但增加约 2s 延迟
  enable_hyde: false
  expansion:
    num_queries: 3                 # 生成的查询变体数量（含原始查询）
    merge_top_k: 10                # 每个变体的最大召回数
    final_top_k: 5                 # 融合后最终返回数
  hyde:
    doc_length: 150                # 假设文档目标字数
  step_back:
    merge_top_k: 10
    final_top_k: 5
  decomposition:
    max_sub_queries: 5             # 最大子问题数量
    merge_top_k: 10
    final_top_k: 5

# ── 异步 Embedding 配置 ──────────────────────────────────────────
async_embedding:
  enabled: true
  batch_size: 10          # 每批次文本数（DashScope限制≤10）
  max_concurrency: 4      # 最大并发 API 请求数
  rate_limit: 500        # 每秒最大请求数
  retry_on_failure: 3     # 失败重试次数

# ── 向量索引配置 ──────────────────────────────────────────────────
vector_index:
  enabled: true            # 是否启用向量索引（false=精确暴力搜索）
  method: hnsw             # 索引类型：hnsw | ivfflat
  hnsw:
    m: 16                  # 每个节点的最大连接数（越大召回越高，内存越大）
    ef_construction: 64    # 构建时的搜索深度（越大图质量越高）
  query:
    ef_search: 40          # 查询时的搜索深度（越大召回越高，查询越慢）
