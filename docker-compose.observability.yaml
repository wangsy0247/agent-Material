# =============================================================
# 可观测性基础设施 — Docker Compose
#
# 启动: docker-compose -f docker-compose.observability.yaml up -d
# 停止: docker-compose -f docker-compose.observability.yaml down
# 日志: docker-compose -f docker-compose.observability.yaml logs -f
# =============================================================

version: "3.3"

services:
  # ── Jaeger: 追踪数据接收 + 存储 + UI ──────────────────────
  jaeger:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "16686:16686"   # Jaeger UI (浏览器打开 http://localhost:16686)
      - "4318:4318"     # OTLP HTTP 接收端 (应用发送 Span 到这里)
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped

  # ── Prometheus: 指标抓取 + 存储 ───────────────────────────
  prometheus:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/quay.io/prometheus/prometheus:v3.5.0
    container_name: prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:172.20.171.124"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  # ── Grafana: 统一可视化仪表板 ────────────────────────────
  grafana:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/grafana/grafana:main
    container_name: grafana
    ports:
      - "3000:3000"     # Grafana UI (浏览器打开 http://localhost:3000)
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_AUTH_BASIC_ENABLED=false
      - GF_USERS_DEFAULT_LANGUAGE=zh-Hans
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:


